[package]
name = "wa-wire-adapter-whatsapp-rust"
version = "0.1.0"
description = "wa-wire adapter for the whatsapp-rust engine, in tap mode"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/oxidezap/wa-wire"
authors = ["oxidezap"]

# Its own workspace: this crate pulls in the whole engine — tokio, TLS, protobuf
# — and putting that in the main workspace would make every `cargo test` there
# pay for it. The contract and codec stay dependency-free on purpose.
[workspace]

[dependencies]
wa-wire-adapter = { path = "../../crates/wa-wire-adapter" }
# One engine dependency. `whatsapp-rust` re-exports `wacore` and
# `wacore_binary`, so naming them separately would only risk them drifting to a
# different version than the engine actually links.
whatsapp-rust = { path = "../../../whatsapp-rust", features = ["plugins"] }
anyhow = "1"

[features]
# Turns off TLS and certificate-chain verification for `capture-corpus`, which a
# server presenting a self-signed certificate needs. A feature rather than a
# runtime flag so a build without it cannot be talked into skipping either.
insecure-capture = [
    "whatsapp-rust/danger-skip-tls-verify",
    "whatsapp-rust/danger-skip-cert-chain-verify",
]

[dev-dependencies]
wa-wire-codec = { path = "../../crates/wa-wire-codec", features = ["bundled-tokens"] }
# The conformance comparison needs both engines' output, and this crate is the
# only place that has one of them plus a way to read the other's recording.
wa-wire-conformance = { path = "../../crates/wa-wire-conformance" }
wa-wire-contract = { path = "../../crates/wa-wire-contract" }
wa-wire-l1 = { path = "../../crates/wa-wire-l1" }
whatsapp-rust-tokio-transport = { path = "../../../whatsapp-rust/transports/tokio-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ureq = "3"
env_logger = "0.11" 

[[example]]
name = "capture-corpus"
# The capture only makes sense against a server, and the only servers worth
# pointing it at during development present their own certificate.
required-features = ["insecure-capture"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
