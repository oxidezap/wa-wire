# Inherited from the engine, not chosen here. `whatsapp-rust` enables
# `wacore-binary/simd`, which needs `feature(portable_simd)`. This crate does not
# name `wacore-binary` at all and still cannot escape it: the engine links it
# with that feature on, and a feature cannot be turned off from a dependent.
#
# The wa-wire crates themselves build on stable. Only an adapter is bound to its
# engine's toolchain, which is part of what depending on an engine costs.
[toolchain]
channel = "nightly-2026-06-16"
components = ["rustfmt", "clippy"]
