name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The contract is the product; a regression in coverage is a regression in
  # confidence. Raise this as coverage improves, never lower it.
  MIN_COVERAGE: 95

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  portability:
    name: no_std and wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Decoding must not need an allocator: a consumer that only reads
      # envelopes should build on targets without one.
      - name: Build without alloc
        run: cargo build -p wa-wire-contract --no-default-features

      - name: Build the codec without its bundled tokens
        run: cargo build -p wa-wire-codec --no-default-features

      # JS adapters consume the core through WebAssembly, so this target is
      # part of the contract's reach, not an afterthought.
      - name: Build for wasm32
        run: cargo build --workspace --target wasm32-unknown-unknown

  # Adapters are deliberately outside this matrix. Each needs its engine checked
  # out beside this repo and inherits that engine's toolchain, so building them
  # here would make the contract's CI depend on someone else's release cadence.
  # Each adapter carries its own test command; see its README.
  #
  # The four-engine agreement does run here, over committed recordings:
  # `crates/wa-wire-conformance/tests/engine_agreement.rs` reads one `.wawr` per
  # engine and compares all six pairs. That catches our own side moving — a
  # change to the derivation or the codec that makes four streams stop agreeing
  # — which is the half that changes most often and the half nothing watched.
  #
  # Producing those recordings still needs all four engines at once, so
  # `adapters/whatsapp-rust/tests/engine_agreement.rs` keeps the live run and
  # `emit-agreement-recordings` refreshes the frozen one. A recording of a
  # corpus that has since changed is refused rather than passed, so a stale file
  # cannot read as agreement.
  #
  # The cross-language fixture check runs here too: the ones the zapo and
  # hypermeow adapters write are committed and read by the same crate. That
  # catches the three encoders drifting apart, which matters most for the Go
  # one, since it has no Rust to check itself against.

  docs:
    name: the design document agrees with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Citations into an engine need that engine beside this repository, and
      # none is checked out here. Those are reported and skipped; what runs is
      # everything settled from this repository alone, which is the class of
      # defect that reached crates.io.
      - name: Check DESIGN.md
        run: python3 tools/check-docs.py

  generated:
    name: generated code is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Generated code is committed so a protocol change arrives as a reviewable
      # diff (RFC-009). Regenerating here is what rules out drift.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate token dictionaries
        run: python3 tools/generate-tokens.py

      - name: Regenerate the L1 derivation
        run: python3 tools/generate-l1.py

      - name: Regenerate the payload field numbers
        run: python3 tools/generate-content.py

      - name: Regenerate the outgoing derivation
        run: python3 tools/generate-outgoing.py

      # The Go adapter's fixtures are read by `cargo test -p wa-wire-conformance`
      # and are the only check on that encoder, which has no Rust to compare
      # itself against. Reading committed files proves the *reader* agrees with
      # what was committed; regenerating them is what proves the writer still
      # produces it.
      #
      # The encoder is a package of its own with no engine dependency, so this
      # needs Go and nothing else — `emit-fixtures` imports the format and not
      # the adapter.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Regenerate the Go adapter's fixtures
        working-directory: adapters/hypermeow
        run: go run ./cmd/emit-fixtures

      - name: Require no change
        run: |
          if ! git diff --quiet; then
            echo "Generated code is stale. Run tools/generate-tokens.py and commit."
            git diff --stat
            exit 1
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Measure
        run: cargo llvm-cov --workspace --all-features --json --output-path coverage.json

      - name: Enforce threshold
        run: |
          percent=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          printf 'line coverage: %.2f%% (minimum %s%%)\n' "$percent" "$MIN_COVERAGE"
          awk -v p="$percent" -v min="$MIN_COVERAGE" \
            'BEGIN { if (p + 0 < min + 0) { print "coverage below threshold"; exit 1 } }'

      - name: Report
        run: cargo llvm-cov report --summary-only
