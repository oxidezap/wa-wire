[workspace]
resolver = "3"
members = [
    "crates/wa-wire-adapter",
    "crates/wa-wire-codec",
    "crates/wa-wire-contract",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/oxidezap/wa-wire"
authors = ["oxidezap"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Arithmetic on offsets must be checked: `usize` is 32-bit on wasm32 and on the
# ESP32 targets this ecosystem already builds for, so a length read from an
# untrusted envelope can overflow where it would not on a 64-bit host.
arithmetic_side_effects = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
