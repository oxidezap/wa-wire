[package]
name = "wa-wire-example-consumer"
version = "0.1.0"
description = "A wa-wire consumer, written once and run against any engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The point of this crate is what is *absent*: no engine, no runtime, no
# transport. A consumer talks to the boundary and nothing else, and `cargo tree`
# is the proof.
[dependencies]
wa-wire-codec = { path = "../wa-wire-codec" }
wa-wire-contract = { path = "../wa-wire-contract" }
wa-wire-l1 = { path = "../wa-wire-l1" }

[dev-dependencies]
wa-wire-codec = { path = "../wa-wire-codec", features = ["bundled-tokens"] }

[lints]
workspace = true
