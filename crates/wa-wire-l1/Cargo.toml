[package]
name = "wa-wire-l1"
version = "0.1.0"
description = "The L1 derivation: typed canonical events from parsed stanzas, generated from whatspec"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Stanza fixtures. Exposed to dependents because an adapter and the conformance
# runner both need to build stanzas, and a second copy would be a second thing
# to keep true.
testing = []

[dependencies]
wa-wire-codec = { path = "../wa-wire-codec", version = "0.1.0", default-features = false }
wa-wire-proto = { path = "../wa-wire-proto", version = "0.1.0" }

[dev-dependencies]
# Points at this crate, to turn on `testing` for its own tests. Left without a
# version on purpose: a version requirement would send cargo to the registry
# for the crate it is in the middle of packaging. Dev-dependencies are dropped
# from the published manifest, so nothing needs one.
wa-wire-l1 = { path = ".", features = ["testing"] }

[lints]
workspace = true
